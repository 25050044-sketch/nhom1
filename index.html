<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giới Thiệu Nhóm 5 Thành Viên</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f0f4f8;
            color: #333;
            text-align: center;
            padding: 40px 20px;
        }

        h1 {
            margin-bottom: 10px;
            color: #1e293b;
        }

        p.subtitle {
            color: #64748b;
            margin-bottom: 40px;
        }

        /* Khung chứa 5 thành viên */
        .team-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 25px;
            max-width: 1100px;
            margin: 0 auto;
        }

        /* Thẻ từng thành viên */
        .member-card {
            background: #ffffff;
            width: 200px;
            padding: 25px 15px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
            text-decoration: none;
            color: inherit;
            transition: transform 0.25s ease, box-shadow 0.25s ease;
        }

        .member-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
        }

        .member-card img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #3b82f6;
            margin-bottom: 15px;
        }

        .member-card h3 {
            font-size: 18px;
            margin-bottom: 5px;
            color: #0f172a;
        }

        .member-card p {
            font-size: 14px;
            color: #64748b;
            margin-bottom: 15px;
        }

        .btn-view {
            display: inline-block;
            padding: 6px 14px;
            background-color: #3b82f6;
            color: #fff;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <h1>DANH SÁCH THÀNH VIÊN NHÓM</h1>
    <p class="subtitle">Nhấp vào từng thành viên để xem thông tin chi tiết</p>

    <div class="team-container">
        <!-- Thành viên 1 -->
        <a href="bai lam/thanh vien1.html" class="member-card">
            <img src="https://via.placeholder.com/100" alt="Avatar 1">
            <h3>Pham Quoc Khanh</h3>
            <span class="btn-view">Xem hồ sơ</span>
        </a>

        <!-- Thành viên 2 -->
        <a href="le tan phat/thanh vien2.html" class="member-card">
            <img src="https://via.placeholder.com/100" alt="Avatar 2">
            <h3>Le Tan Phat</h3>
            <span class="btn-view">Xem hồ sơ</span>
        </a>

        <!-- Thành viên 3 -->
        <a href="profile/LêHoàngNam-25050053.html" class="member-card">
            <img src="https://via.placeholder.com/100" alt="Avatar 3">
            <h3>Le Hoang Nam</h3>
            <span class="btn-view">Xem hồ sơ</span>
        </a>

        <!-- Thành viên 4 -->
        <a href="thanhvien4.html" class="member-card">
            <img src="https://via.placeholder.com/100" alt="Avatar 4">
            <h3>Thành Viên 4</h3>
            <p>Nội Dung</p>
            <span class="btn-view">Xem hồ sơ</span>
        </a>

        <!-- Thành viên 5 -->
        <a href="thanhvien5.html" class="member-card">
            <img src="https://via.placeholder.com/100" alt="Avatar 5">
            <h3>Thành Viên 5</h3>
            <p>Thuyết Trình</p>
            <span class="btn-view">Xem hồ sơ</span>
        </a>
    </div>

</body>
</html>
