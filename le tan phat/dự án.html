<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="dự án.css" />
  </head>
  <body>
    <section id="projects">
      <h2 class="section-title">Dự Án Cá Nhân</h2>

      <!-- Bộ lọc loại dự án -->
      <div class="filter-btns">
        <button class="filter-btn active" data-filter="all">Tất cả</button>
        <button class="filter-btn active" data-filter="all">Web App</button>
        <button class="filter-btn active" data-filter="all">
          Landing Page
        </button>
      </div>

      <div class="projects-grid">
        <!-- Dự án 1 -->
        <div class="project-card" data-category="web">
          <img src="Dự án 1.png" alt="Dự án kinh doanh" class="project-img" />
          <div class="project-info">
            <h3>Dự án Khởi nghiệp kinh doanh chè dưỡng nhan</h3>
            <p
              style="
                font-size: 0.9rem;
                color: var(--text-muted);
                margin-top: 5px;
              "
            >
              Nuôi dưỡng làn da, thanh lọc cơ thể.
            </p>
            <div class="project-tags">
              <span class="tag">HTML5</span>
              <span class="tag">CSS Grid</span>
              <span class="tag">JavaScript</span>
            </div>
            <div class="project-links">
              <a href="#" target="_blank"
                ><i class="fa-solid fa-external-link"></i> Xem Demo</a
              >
              <a href="#" target="_blank"
                ><i class="fa-brands fa-github"></i> GitHub</a
              >
            </div>
          </div>
        </div>
        <div class="projects-grid">
          <!-- Dự án 1 -->
          <div class="project-card" data-category="web">
            <img src="Dự án 2.png" alt="Dự án kinh doanh" class="project-img" />
            <div class="project-info">
              <h3>Nến thơm Hoa Lâm</h3>
              <p
                style="
                  font-size: 0.9rem;
                  color: var(--text-muted);
                  margin-top: 5px;
                "
              >
                Hương thơm vỗ về, xua tan mệt mỏi.
              </p>
              <div class="project-tags">
                <span class="tag">HTML5</span>
                <span class="tag">CSS Grid</span>
                <span class="tag">JavaScript</span>
              </div>
              <div class="project-links">
                <a href="#" target="_blank"
                  ><i class="fa-solid fa-external-link"></i> Xem Demo</a
                >
                <a href="#" target="_blank"
                  ><i class="fa-brands fa-github"></i> GitHub</a
                >
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </body>
</html>
