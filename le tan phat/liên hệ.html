<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Liên Hệ - Gửi Tin Nhắn</title>

    <!-- Bootstrap 5 CSS CDN -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Font Awesome Icons CDN -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />

    <!-- Custom CSS -->
    <link rel="stylesheet" href="liên hệ.css" />
  </head>
  <body>
    <!-- FORM LIÊN HỆ -->
    <section
      id="contact"
      class="contact-section py-5 min-vh-100 d-flex align-items-center"
    >
      <div class="container py-4">
        <!-- Tiêu đề phần -->
        <div class="text-center mb-5">
          <h2 class="display-6 fw-bold text-white mb-2">
            Gửi Tin Nhắn Cho Tôi
          </h2>
          <div class="title-underline mx-auto"></div>
        </div>

        <!-- Khối Form Liên Hệ -->
        <div class="row justify-content-center">
          <div class="col-lg-7 col-md-9">
            <div class="custom-card p-4 p-md-5 rounded-4 shadow-lg">
              <h3
                class="h4 text-info fw-bold text-center mb-4 d-flex align-items-center justify-content-center gap-2"
              >
                <i class="fa-regular fa-envelope fs-3"></i>
                <span>Liên hệ trao đổi công việc</span>
              </h3>

              <form id="contactForm" class="contact-form" novalidate>
                <!-- Họ và Tên -->
                <div class="form-group mb-4">
                  <label
                    for="name"
                    class="form-label text-light fw-semibold mb-2"
                  >
                    <i class="fa-regular fa-user me-1 text-primary"></i> Họ và
                    Tên (*)
                  </label>
                  <input
                    type="text"
                    id="name"
                    class="form-control custom-input"
                    placeholder="Nhập họ và tên của bạn..."
                  />
                  <span
                    class="error-msg text-danger small mt-1 d-none"
                    id="nameError"
                  >
                    Vui lòng nhập họ và tên.
                  </span>
                </div>

                <!-- Email -->
                <div class="form-group mb-4">
                  <label
                    for="email"
                    class="form-label text-light fw-semibold mb-2"
                  >
                    <i class="fa-regular fa-paper-plane me-1 text-primary"></i>
                    Email (*)
                  </label>
                  <input
                    type="email"
                    id="email"
                    class="form-control custom-input"
                    placeholder="example@domain.com"
                  />
                  <span
                    class="error-msg text-danger small mt-1 d-none"
                    id="emailError"
                  >
                    Email không hợp lệ.
                  </span>
                </div>

                <!-- Nội dung tin nhắn -->
                <div class="form-group mb-4">
                  <label
                    for="message"
                    class="form-label text-light fw-semibold mb-2"
                  >
                    <i class="fa-regular fa-comment-dots me-1 text-primary"></i>
                    Nội dung tin nhắn (*)
                  </label>
                  <textarea
                    id="message"
                    rows="5"
                    class="form-control custom-input"
                    placeholder="Nhập nội dung bạn cần trao đổi..."
                  ></textarea>
                  <span
                    class="error-msg text-danger small mt-1 d-none"
                    id="messageError"
                  >
                    Vui lòng nhập nội dung tin nhắn.
                  </span>
                </div>

                <!-- Nút Gửi -->
                <button
                  type="submit"
                  class="btn btn-primary btn-lg w-100 rounded-pill py-3 fw-bold shadow-sm custom-btn"
                >
                  <i class="fa-solid fa-paper-plane me-2"></i> Gửi Tin Nhắn Ngay
                </button>
              </form>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
